<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>icon source</title>
<style>
  /* Never served by Express — only ever opened via file:// by
     generate-pwa-icons.mjs, screenshotted at whatever viewport size that
     script sets. Reproduces public/ritual-ledger.html's .brand .glyph mark
     exactly (same gradient stops, same SVG), full-bleed on a --void square
     so it reads as a filled app icon rather than a circle on transparency. */
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:#0a0610;
    display:flex; align-items:center; justify-content:center;
  }
  .circle{
    width:82vmin; height:82vmin;
    border-radius:50%;
    background: conic-gradient(from 210deg, #4f3cc9, #ff2e88, #c9a227, #4f3cc9);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 6vmin rgba(255,46,136,0.35);
  }
</style>
</head>
<body>
  <div class="circle">
    <svg width="56vmin" height="56vmin" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="glyphLiquid" gradientUnits="userSpaceOnUse" x1="34" y1="66" x2="62" y2="40">
          <stop offset="0%" stop-color="#050208"/>
          <stop offset="24%" stop-color="#170f2c"/>
          <stop offset="40%" stop-color="#6b52c4"/>
          <stop offset="48%" stop-color="#b9a6ff"/>
          <stop offset="56%" stop-color="#170f2c"/>
          <stop offset="78%" stop-color="#050208"/>
          <stop offset="100%" stop-color="#0d0716"/>
        </linearGradient>
      </defs>
      <rect x="32" y="8" width="36" height="7" rx="2.5" fill="#f2e8ef"/>
      <path d="M36,15 L64,15 L64,44 L36,44 Z" fill="#f2e8ef" opacity="0.55"/>
      <path d="M36,44 L64,44 L64,64 A14,14 0 0 1 36,64 Z" fill="url(#glyphLiquid)"/>
      <rect x="36" y="43.1" width="28" height="1.5" rx="0.7" fill="#f2e8ef" opacity="0.45"/>
      <circle cx="50" cy="49" r="0.8" fill="#f2e8ef" opacity="0.85"/>
      <polygon points="44,52 44.9,54.4 47.3,55.3 44.9,56.2 44,58.6 43.1,56.2 40.7,55.3 43.1,54.4" fill="#c9a227"/>
      <polygon points="55,57 55.7,58.8 57.5,59.5 55.7,60.2 55,62 54.3,60.2 52.5,59.5 54.3,58.8" fill="#f2e8ef"/>
      <path d="M36,15 L64,15 L64,64 A14,14 0 0 1 36,64 Z" fill="none" stroke="#f2e8ef" stroke-width="3.4"/>
      <polygon points="18,22 19.8,26.7 24.5,28.5 19.8,30.3 18,35 16.2,30.3 11.5,28.5 16.2,26.7" fill="#c9a227"/>
      <polygon points="83,26 84.4,29.6 88,31 84.4,32.4 83,36 81.6,32.4 78,31 81.6,29.6" fill="#f2e8ef"/>
      <polygon points="76,66 76.9,68.4 79.3,69.3 76.9,70.2 76,72.6 75.1,70.2 72.7,69.3 75.1,68.4" fill="#c9a227"/>
      <polygon points="24,70 24.9,72.4 27.3,73.3 24.9,74.2 24,76.6 23.1,74.2 20.7,73.3 23.1,72.4" fill="#f2e8ef"/>
    </svg>
  </div>
</body>
</html>

# Neither the app nor the test-runner calls the Kubernetes API, so neither needs any
# RBAC bindings — but both still get a dedicated ServiceAccount rather than implicitly
# using `default`, and `automountServiceAccountToken: false` since there's no API access
# to make. Small, concrete least-privilege defaults instead of relying on the cluster's
# fallback behavior.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ritual-ledger-app
  namespace: ritual-ledger
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ritual-ledger-test-runner
  namespace: ritual-ledger
automountServiceAccountToken: false
